<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Croque-moi les fesses">
  <meta name="format-detection" content="telephone=no">
  <title>Croque-moi les fesses</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="croque.css">
</head>
<body>
  <div class="app">
    <!-- Barre du haut -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <a class="icon-btn" href="../../index.html" aria-label="Retour à l'accueil">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <label class="icon-btn" for="file-input" id="btn-new" aria-label="Choisir une autre photo" hidden>
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-4-4-7 8"/></svg>
        </label>
      </div>
      <h1 class="title"><span class="nowrap">Croque-moi</span> les fesses</h1>
      <div class="topbar-right history" aria-label="Historique">
        <button class="icon-btn" id="btn-undo" type="button" aria-label="Précédent" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
        </button>
        <button class="icon-btn" id="btn-redo" type="button" aria-label="Suivant" disabled>
          <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg>
        </button>
      </div>
    </header>

    <!-- Croquis -->
    <main class="stage" id="stage">
      <div class="empty" id="empty">
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M17.5 3l3.5 3.5L9 18.5 4.5 19.5 5.5 15z"/><path d="M14.5 6l3.5 3.5"/><path d="M11 21c3-1.5 6 .5 10-1.5"/></svg>
        </div>
        <label class="btn btn-primary btn-big" for="file-input">
          <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          Charger une photo
        </label>
        <p class="empty-hint">Elle sera redessinée au fusain, sans jamais quitter votre téléphone.</p>
      </div>

      <div class="canvas-wrap" id="canvas-wrap" hidden>
        <canvas id="drawing"></canvas>
        <canvas id="original"></canvas>
        <div class="points" id="points"></div>
      </div>

      <div class="status" id="status" role="status" aria-live="polite" hidden>
        <span id="status-text"></span>
        <span class="progress"><span class="progress-bar" id="progress-bar"></span></span>
      </div>
      <button class="zoom-reset" id="btn-zoom-reset" type="button" hidden>Voir tout</button>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <!-- Barres du bas -->
    <div class="bottom-bars" id="bottom-bars" hidden>
      <div class="controls">
        <p class="hint" id="hint">Touchez ce qui doit rester fin (visage, mains…)</p>
        <label class="slider">
          <span class="end">Estompé</span>
          <input type="range" id="technique" min="0" max="100" step="5" value="50" aria-label="Geste : de l'estompe aux hachures">
          <span class="end">Hachuré</span>
        </label>
      </div>
      <nav class="toolbar" aria-label="Actions">
        <button type="button" class="tool" id="btn-original" aria-label="Maintenir pour voir l'original">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Original</span>
        </button>
        <button type="button" class="tool" id="btn-variant">
          <svg viewBox="0 0 24 24"><path d="M20 7a8 8 0 00-14-1L4 8"/><path d="M4 4v4h4"/><path d="M4 17a8 8 0 0014 1l2-2"/><path d="M20 20v-4h-4"/></svg>
          <span>Autre version</span>
        </button>
        <button type="button" class="tool" id="btn-clear" disabled>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
          <span>Effacer points</span>
        </button>
        <button type="button" class="tool tool--save" id="btn-save" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
          <span>Exporter</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Feuille d'export -->
  <div class="sheet-backdrop" id="save-sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="save-title">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <h2 id="save-title">Votre croquis est prêt</h2>
      <div class="sheet-preview"><img id="save-preview" alt="Aperçu du croquis"></div>
      <p class="sheet-hint" id="save-hint"></p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary btn-big" id="btn-share">
          <svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 00-1 1v8a1 1 0 001 1h14a1 1 0 001-1v-8a1 1 0 00-1-1h-1"/></svg>
          Enregistrer dans Photos
        </button>
        <a class="btn btn-ghost btn-big" id="btn-download" download>Télécharger le fichier</a>
        <button type="button" class="btn btn-ghost" id="btn-close-sheet">Continuer</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" hidden>
  <script src="croque.js"></script>
  <script src="../../assets/js/register-sw.js"></script>
</body>
</html>
