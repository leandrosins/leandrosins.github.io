<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gazette-moi">
  <meta name="format-detection" content="telephone=no">
  <title>Gazette-moi</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="gazette.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <a class="icon-btn" href="../../index.html" aria-label="Retour à l'accueil">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
      </div>
      <h1 class="title">Gazette-moi</h1>
      <div class="topbar-right"></div>
    </header>

    <main class="stage" id="stage">
      <div class="empty" id="empty">
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 01-2-2z"/><path d="M17 8h3v9a2 2 0 01-2 2h-1"/><rect x="7" y="8" width="7" height="5"/><path d="M7 16h7"/></svg>
        </div>
        <label class="btn btn-primary btn-big" for="page-input">
          <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          1. Choisir la page
        </label>
        <p class="empty-hint">L’image fixe du journal. Ensuite, un GIF ou une vidéo viendra s’animer dedans, comme dans une gazette magique.</p>
      </div>

      <canvas id="scene" hidden></canvas>

      <div class="status" id="status" role="status" aria-live="polite" hidden>
        <span id="status-text"></span>
        <span class="progress"><span class="progress-bar" id="progress-bar"></span></span>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <div class="bottom-bars" id="bottom-bars" hidden>
      <div class="controls">
        <label class="btn btn-primary step-btn" for="anim-input" id="anim-step">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
          2. Choisir le GIF ou la vidéo
        </label>
        <div id="anim-controls" hidden>
          <div class="modes modes--3" role="group" aria-label="Effet">
            <button type="button" class="mode is-active" data-effect="gris" aria-pressed="true">Gris</button>
            <button type="button" class="mode" data-effect="sepia" aria-pressed="false">Sépia</button>
            <button type="button" class="mode" data-effect="couleur" aria-pressed="false">Couleur</button>
          </div>
          <p class="hint">Glissez la photo pour la placer · coin pour la taille · 2 doigts pour agrandir</p>
        </div>
      </div>
      <nav class="toolbar toolbar--3" aria-label="Actions">
        <label class="tool" for="page-input">
          <svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 01-2-2z"/><path d="M17 8h3v9a2 2 0 01-2 2h-1"/><path d="M7 9h7M7 12h7M7 15h4"/></svg>
          <span>Page</span>
        </label>
        <label class="tool" for="anim-input" id="btn-anim">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
          <span>Animation</span>
        </label>
        <button type="button" class="tool tool--save" id="btn-save" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
          <span>Créer le GIF</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Feuille d'export -->
  <div class="sheet-backdrop" id="save-sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="save-title">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <h2 id="save-title">Votre gazette est prête</h2>
      <div class="sheet-preview"><img id="save-preview" alt="Aperçu du GIF"></div>
      <p class="sheet-hint" id="save-hint"></p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary btn-big" id="btn-share">
          <svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 00-1 1v8a1 1 0 001 1h14a1 1 0 001-1v-8a1 1 0 00-1-1h-1"/></svg>
          Enregistrer dans Photos
        </button>
        <a class="btn btn-ghost btn-big" id="btn-download" download>Télécharger le fichier</a>
        <button type="button" class="btn btn-ghost" id="btn-close-sheet">Continuer</button>
      </div>
    </div>
  </div>

  <input type="file" id="page-input" accept="image/*" hidden>
  <input type="file" id="anim-input" accept="image/gif,video/*" hidden>
  <video id="video" muted playsinline preload="auto" hidden></video>
  <script src="gif-decode.js"></script>
  <script src="gazette.js"></script>
  <script src="../../assets/js/register-sw.js"></script>
</body>
</html>
