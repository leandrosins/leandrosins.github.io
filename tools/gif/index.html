<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GIF-moi encore">
  <meta name="format-detection" content="telephone=no">
  <title>GIF-moi encore</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="gif.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Barre du haut -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <a class="icon-btn" href="../../index.html" aria-label="Retour à l'accueil">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
      </div>
      <h1 class="title"><span class="nowrap">GIF-moi</span> encore</h1>
      <div class="topbar-right">
        <label class="icon-btn" for="file-input" id="btn-new" aria-label="Choisir une autre vidéo" hidden>
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3"/></svg>
        </label>
      </div>
    </header>

    <!-- Vidéo -->
    <main class="stage" id="stage">
      <div class="empty" id="empty">
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3"/></svg>
        </div>
        <label class="btn btn-primary btn-big" for="file-input">
          <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          Choisir une vidéo
        </label>
        <p class="empty-hint">Depuis votre bibliothèque. La vidéo ne quitte jamais votre téléphone.</p>
      </div>

      <div class="player" id="player" hidden>
        <video id="video" playsinline muted preload="auto" disablepictureinpicture></video>
        <canvas id="overlay"></canvas>
        <div class="badge-erotic" id="badge-erotic" hidden>Erotic mod · ralenti ×3</div>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <!-- Barres du bas -->
    <div class="bottom-bars" id="bottom-bars" hidden>
      <!-- Texte -->
      <section class="panel" id="text-panel" hidden>
        <div class="panel-row">
          <input class="text-input" id="text-input" type="text" maxlength="60" placeholder="Votre texte" autocomplete="off" enterkeyhint="done" spellcheck="false">
          <button type="button" class="btn btn-ghost btn-icon-only" id="text-clear" aria-label="Effacer le texte">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="chips" id="text-fonts" role="radiogroup" aria-label="Police"></div>
        <div class="panel-row panel-row--wrap">
          <div class="swatches" id="text-colors" role="radiogroup" aria-label="Couleur"></div>
          <div class="segmented segmented--small" id="text-styles" role="radiogroup" aria-label="Style"></div>
        </div>
        <label class="slider">
          <span class="slider-label">Taille</span>
          <input type="range" id="text-size" min="3" max="30" step="0.5" value="9">
        </label>
        <p class="hint">Glissez sur la vidéo pour placer le texte, pincez pour le redimensionner.</p>
      </section>

      <!-- Découpe -->
      <section class="trim" id="trim">
        <div class="trim-labels">
          <span id="trim-range">0:00,0 → 0:00,0</span>
          <span class="trim-out" id="trim-out">GIF de 0,0 s</span>
        </div>
        <div class="track" id="track">
          <div class="track-bg"></div>
          <div class="track-sel" id="track-sel">
            <span class="handle handle--start" id="handle-start" aria-label="Début"></span>
            <span class="handle handle--end" id="handle-end" aria-label="Fin"></span>
          </div>
          <div class="playhead" id="playhead"></div>
        </div>
      </section>

      <nav class="toolbar" id="toolbar" aria-label="Actions">
        <button type="button" class="tool" id="btn-text" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg>
          <span>Texte</span>
        </button>
        <button type="button" class="tool tool--erotic" id="btn-erotic" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg>
          <span>Erotic mod</span>
        </button>
        <button type="button" class="tool tool--save" id="btn-make">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10.5 9.5v5l4-2.5z"/></svg>
          <span>Créer le GIF</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Progression -->
  <div class="busy" id="busy" hidden>
    <div class="busy-card" role="status" aria-live="polite">
      <p class="busy-title" id="busy-title">Création du GIF…</p>
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <p class="busy-step" id="busy-step"></p>
      <button type="button" class="btn btn-ghost" id="btn-cancel">Annuler</button>
    </div>
  </div>

  <!-- Résultat -->
  <div class="sheet-backdrop" id="save-sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="save-title">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <h2 id="save-title">Votre GIF est prêt</h2>
      <div class="sheet-preview"><img id="save-preview" alt="Aperçu du GIF"></div>
      <p class="sheet-info" id="save-info"></p>
      <p class="sheet-hint" id="save-hint"></p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary btn-big" id="btn-share">
          <svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 00-1 1v8a1 1 0 001 1h14a1 1 0 001-1v-8a1 1 0 00-1-1h-1"/></svg>
          Enregistrer dans Photos
        </button>
        <a class="btn btn-ghost btn-big" id="btn-download" download>Télécharger le fichier</a>
        <button type="button" class="btn btn-ghost" id="btn-close-sheet">Continuer</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept="video/*" hidden>
  <script src="gif.js"></script>
  <script src="../../assets/js/register-sw.js"></script>
</body>
</html>
