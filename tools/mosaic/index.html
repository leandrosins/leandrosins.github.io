<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mozaïc-Me">
  <meta name="format-detection" content="telephone=no">
  <title>Mozaïc-Me</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="mosaic.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Barre du haut -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <a class="icon-btn" href="../../index.html" aria-label="Retour à l'accueil">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
      </div>
      <h1 class="title">Mozaïc-Me</h1>
      <div class="topbar-right history" aria-label="Historique">
        <button class="icon-btn" id="btn-undo" type="button" aria-label="Précédent" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
        </button>
        <button class="icon-btn" id="btn-redo" type="button" aria-label="Suivant" disabled>
          <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg>
        </button>
      </div>
    </header>

    <!-- Éditeur : la mosaïque occupe tout l'écran -->
    <main class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <!-- Choix du nombre de photos et de la grille -->
    <section class="setup" id="setup">
      <div class="setup-inner">
        <h2 class="setup-title">Combien de photos&nbsp;?</h2>
        <div class="count-picker" role="radiogroup" aria-label="Nombre de photos" id="count-picker">
          <button type="button" role="radio" data-count="2" aria-checked="false">2</button>
          <button type="button" role="radio" data-count="4" aria-checked="true">4</button>
          <button type="button" role="radio" data-count="6" aria-checked="false">6</button>
        </div>

        <h2 class="setup-title">Choisissez une grille</h2>
        <h3 class="setup-sub">
          <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/></svg>Portrait
        </h3>
        <div class="grid-list" id="grids-portrait"></div>
        <h3 class="setup-sub">
          <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/></svg>Paysage
        </h3>
        <div class="grid-list" id="grids-landscape"></div>

        <button type="button" class="btn btn-ghost btn-big setup-cancel" id="setup-cancel" hidden>Revenir à ma mosaïque</button>
      </div>
    </section>

    <!-- Barres du bas -->
    <div class="bottom-bars" id="bottom-bars">
      <!-- Case sélectionnée -->
      <section class="panel" id="panel">
        <div class="panel-row">
          <p class="hint" id="cell-hint">Pincez pour zoomer, glissez pour cadrer</p>
          <button type="button" class="btn btn-primary" id="btn-done">
            <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>OK
          </button>
        </div>
        <div class="cell-actions">
          <button type="button" class="btn btn-ghost" id="btn-replace">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-4-4-7 8"/></svg>Changer
          </button>
          <button type="button" class="btn btn-ghost" id="btn-fit">
            <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Recadrer
          </button>
          <button type="button" class="btn btn-ghost" id="btn-remove">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Retirer
          </button>
        </div>
      </section>

      <nav class="toolbar" id="toolbar" aria-label="Actions">
        <button type="button" class="tool" id="btn-grid">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="11" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="18" width="7" height="3" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Grille</span>
        </button>
        <button type="button" class="tool" id="btn-add">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="3"/><path d="M10 9v6M7 12h6"/><path d="M21 8v11a2 2 0 01-2 2H8"/></svg>
          <span>Photos</span>
        </button>
        <button type="button" class="tool tool--save" id="btn-save" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
          <span>Exporter</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Feuille d'export -->
  <div class="sheet-backdrop" id="save-sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="save-title">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <h2 id="save-title">Votre mosaïque est prête</h2>
      <div class="sheet-preview"><img id="save-preview" alt="Aperçu de la mosaïque"></div>
      <p class="sheet-hint" id="save-hint"></p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary btn-big" id="btn-share">
          <svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 00-1 1v8a1 1 0 001 1h14a1 1 0 001-1v-8a1 1 0 00-1-1h-1"/></svg>
          Enregistrer dans Photos
        </button>
        <a class="btn btn-ghost btn-big" id="btn-download" download>Télécharger le fichier</a>
        <button type="button" class="btn btn-ghost" id="btn-close-sheet">Continuer</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" multiple hidden>
  <script src="mosaic.js"></script>
  <script src="../../assets/js/register-sw.js"></script>
</body>
</html>
