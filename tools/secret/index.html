<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Enigme-moi sur le visage">
  <meta name="format-detection" content="telephone=no">
  <title>Enigme-moi sur le visage</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="secret.css">
</head>
<body>
  <div class="app">
    <!-- Barre du haut -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <a class="icon-btn" href="../../index.html" aria-label="Retour à l'accueil">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
        <label class="icon-btn" for="file-input" id="btn-new" aria-label="Choisir une autre photo" hidden>
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-4-4-7 8"/></svg>
        </label>
      </div>
      <h1 class="title"><span class="nowrap">Enigme-moi</span> sur le visage</h1>
      <div class="topbar-right"></div>
    </header>

    <!-- Tableau -->
    <main class="stage" id="stage">
      <div class="empty" id="empty">
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 12a1 1 0 0 1 1 1 2 2 0 0 1-2 2 3 3 0 0 1-3-3 4 4 0 0 1 4-4 5 5 0 0 1 5 5 6 6 0 0 1-6 6 7 7 0 0 1-7-7"/></svg>
        </div>
        <label class="btn btn-primary btn-big" for="file-input">
          <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          Charger une photo
        </label>
        <p class="empty-hint">Brouillez une photo avec un code secret, ou retrouvez une photo brouillée. Rien ne quitte votre téléphone.</p>
      </div>

      <div class="canvas-wrap" id="canvas-wrap" hidden>
        <canvas id="painting"></canvas>
        <canvas id="original"></canvas>
      </div>

      <div class="status" id="status" role="status" aria-live="polite" hidden>
        <span id="status-text"></span>
        <span class="progress"><span class="progress-bar" id="progress-bar"></span></span>
      </div>
      <button class="zoom-reset" id="btn-zoom-reset" type="button" hidden>Voir tout</button>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <!-- Barres du bas -->
    <div class="bottom-bars" id="bottom-bars" hidden>
      <div class="controls">
        <div class="modes" role="group" aria-label="Action">
          <button type="button" class="mode is-active" id="mode-encode" aria-pressed="true">Encoder</button>
          <button type="button" class="mode" id="mode-decode" aria-pressed="false">Décoder</button>
        </div>
        <form class="code-row" id="code-form" autocomplete="off">
          <span class="code-field">
            <input type="text" class="is-masked" id="code" placeholder="Code secret" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Code secret">
            <button type="button" class="code-eye" id="btn-eye" aria-label="Afficher le code" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </span>
          <button type="submit" class="btn btn-primary code-ok" id="btn-ok">OK</button>
        </form>
        <p class="hint" id="hint"></p>
      </div>
      <nav class="toolbar" aria-label="Actions">
        <button type="button" class="tool" id="btn-original" aria-label="Maintenir pour voir l'original">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Original</span>
        </button>
        <button type="button" class="tool tool--save" id="btn-save" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
          <span>Exporter</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Feuille d'export -->
  <div class="sheet-backdrop" id="save-sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="save-title">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <h2 id="save-title">Votre photo est prête</h2>
      <div class="sheet-preview"><img id="save-preview" alt="Aperçu de la photo"></div>
      <p class="sheet-hint" id="save-hint"></p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary btn-big" id="btn-share">
          <svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 00-1 1v8a1 1 0 001 1h14a1 1 0 001-1v-8a1 1 0 00-1-1h-1"/></svg>
          Enregistrer dans Photos
        </button>
        <a class="btn btn-ghost btn-big" id="btn-download" download>Télécharger le fichier</a>
        <button type="button" class="btn btn-ghost" id="btn-close-sheet">Continuer</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" hidden>
  <script src="secret.js"></script>
  <script src="../../assets/js/register-sw.js"></script>
</body>
</html>
