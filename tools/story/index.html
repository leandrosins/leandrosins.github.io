<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Story Maker">
  <meta name="format-detection" content="telephone=no">
  <title>Story Maker</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="story.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <a class="icon-btn" href="../../index.html" aria-label="Retour à l'accueil">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </a>
      </div>
      <h1 class="title">Story Maker</h1>
      <div class="topbar-right"></div>
    </header>

    <!-- Rédaction -->
    <main class="scroller" id="edit">
      <section class="field">
        <h2 class="field-label">Thème</h2>
        <div class="swatches" id="themes" role="radiogroup" aria-label="Thème"></div>
      </section>

      <section class="field">
        <h2 class="field-label">Police</h2>
        <div class="fonts" id="fonts" role="radiogroup" aria-label="Police"></div>
      </section>

      <section class="field">
        <h2 class="field-label">Tampon</h2>
        <div class="stamp-row">
          <label class="avatar" for="photo-input" id="avatar" aria-label="Choisir la photo du tampon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
            <img id="avatar-img" alt="" hidden>
          </label>
          <div class="stamp-fields">
            <input type="text" id="name" class="input" placeholder="Nom sous le tampon" maxlength="40" autocomplete="off" autocorrect="off" spellcheck="false">
            <button type="button" class="link-btn" id="btn-photo-clear" hidden>Retirer la photo</button>
          </div>
        </div>
      </section>

      <section class="field">
        <label class="field-label" for="title-input">Titre</label>
        <input type="text" id="title-input" class="input input--title" placeholder="Le titre de votre histoire" maxlength="120" autocomplete="off">
      </section>

      <section class="field">
        <div class="field-head">
          <label class="field-label" for="text">Texte</label>
          <button type="button" class="link-btn" id="btn-paste">Coller</button>
        </div>
        <textarea id="text" class="input textarea" placeholder="Écrivez ou collez votre histoire…&#10;&#10;Un retour à la ligne = un nouveau paragraphe."></textarea>
        <p class="counter" id="counter"></p>
      </section>
    </main>

    <!-- Aperçu -->
    <main class="scroller preview" id="preview" hidden>
      <canvas id="letter" aria-label="Aperçu de la lettre"></canvas>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <nav class="toolbar" id="toolbar" aria-label="Actions">
      <button type="button" class="tool is-active" id="btn-edit" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
        <span>Écrire</span>
      </button>
      <button type="button" class="tool" id="btn-preview" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Aperçu</span>
      </button>
      <button type="button" class="tool tool--save" id="btn-save">
        <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>
        <span>Exporter</span>
      </button>
    </nav>
  </div>

  <!-- Feuille d'export -->
  <div class="sheet-backdrop" id="save-sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="save-title">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <h2 id="save-title">Votre lettre est prête</h2>
      <div class="sheet-preview"><img id="save-preview" alt="Aperçu de la lettre"></div>
      <p class="sheet-hint" id="save-hint"></p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary btn-big" id="btn-share">
          <svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 00-1 1v8a1 1 0 001 1h14a1 1 0 001-1v-8a1 1 0 00-1-1h-1"/></svg>
          Enregistrer dans Photos
        </button>
        <a class="btn btn-ghost btn-big" id="btn-download" download>Télécharger le fichier</a>
        <button type="button" class="btn btn-ghost" id="btn-close-sheet">Continuer</button>
      </div>
    </div>
  </div>

  <input type="file" id="photo-input" accept="image/*" hidden>
  <script src="letter.js"></script>
  <script src="story.js"></script>
  <script src="../../assets/js/register-sw.js"></script>
</body>
</html>
